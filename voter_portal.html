<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUNWAR DIGITAL SERVICE - मतदाता पर्ची व प्रचार पोर्टल</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Yahan filename ko sahi 'malwara_voters_data.js' ya 'malwara_voter_data.js' ke anusaar rakhein -->
  <script src="malwara_voters_data.js"></script>

  <style>
    body { font-family: 'Noto Sans Devanagari', sans-serif; background-color: #f1f5f9; color: #0f172a; }
    .font-yatra { font-family: 'Yatra One', cursive; }
    .font-rozha { font-family: 'Rozha One', serif; }
    .font-tiro  { font-family: 'Tiro Devanagari Hindi', serif; }

    .bg-royal-maroon { background: radial-gradient(circle at 50% 20%, #881337 0%, #4c0519 100%); }
    .text-gold { color: #fbbf24; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

    @media print {
      body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
      .no-print { display: none !important; }
      .print-page {
        page-break-after: always;
        break-after: page;
        margin: 0 auto;
        padding: 6mm !important;
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        max-width: 210mm !important;
      }
    }
    @page { size: A4 portrait; margin: 6mm; }
    .symbol-box-dashed { border: 2px dashed #dc2626; background-color: #fef2f2; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="no-print bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded text-xs tracking-wider hover:bg-amber-400 transition">
          <i class="fa-solid fa-house mr-1"></i> होम
        </a>
        <div>
          <h1 class="text-base md:text-lg font-bold font-yatra tracking-wide text-amber-400">
            मतदाता पर्ची व प्रचार पोर्टल (डैशबोर्ड)
          </h1>
          <p class="text-[11px] text-slate-300">ग्राम पंचायत मालवाड़ा • पंचायत समिति रानीवाड़ा</p>
        </div>
      </div>

      <div class="flex items-center flex-wrap gap-2 text-xs">
        <div id="activeCandidateBadge" class="bg-slate-800 text-amber-300 px-3 py-1.5 rounded border border-amber-500/40 flex items-center gap-1.5">
          <i class="fa-solid fa-user-check"></i>
          <span id="activeCandidateNameText" class="font-bold">-</span>
        </div>
        <button onclick="openSettingsModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded border border-amber-500/40 flex items-center gap-1.5">
          <i class="fa-solid fa-gear"></i> पोस्टर व चिन्ह सेटिंग
        </button>
        <button onclick="window.print()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-print"></i> प्रिंट (A4)
        </button>
        <button id="btnDownloadImg" onclick="exportToImage()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded flex items-center gap-1.5 shadow">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp कार्ड (PNG)
        </button>
      </div>
    </div>
  </header>

  <section class="no-print bg-white border-b border-slate-200 py-2.5 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-3">
      <div class="w-full md:w-3/5 flex flex-wrap items-center gap-2">
        <div class="relative flex-1 min-w-[220px]">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="नाम, पिता/पति, मकान नं., EPIC या क्रम सं. लिखें..." 
            class="w-full pl-9 pr-3 py-1.5 text-xs md:text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none shadow-inner"
          />
        </div>

        <select id="partFilter" class="py-1.5 px-2 text-xs font-semibold border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-amber-500">
          <option value="all">सभी भाग (235, 236, 237)</option>
          <option value="235">भाग 235 (बायाँ कमरा 2)</option>
          <option value="236">भाग 236 (लाधाणी परिसर)</option>
          <option value="237">भाग 237 (कमरा नं 5)</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-slate-600">प्रारूप:</span>
        <div class="inline-flex rounded-md shadow-sm border border-slate-300 overflow-hidden bg-slate-100 p-0.5">
          <button id="modeFamily" class="px-3 py-1.5 text-xs font-bold rounded bg-amber-600 text-white shadow-sm flex items-center gap-1.5 transition">
            <i class="fa-solid fa-users"></i> परिवार-वार (A4 आधा पोस्टर)
          </button>
          <button id="modePersonal" class="px-3 py-1.5 text-xs font-medium rounded text-slate-700 hover:text-slate-900 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-user"></i> व्यक्तिगत पर्ची (Left / Top)
          </button>
        </div>
        
        <div id="personalPosWrapper" class="hidden flex items-center gap-1 pl-2 border-l border-slate-300">
          <button id="btnPosLeft" class="px-2 py-1 text-xs border rounded bg-slate-800 text-white font-medium">Left</button>
          <button id="btnPosTop" class="px-2 py-1 text-xs border rounded bg-white text-slate-700 font-medium">Top</button>
        </div>
      </div>
    </div>
  </section>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 md:p-4 flex flex-col lg:flex-row gap-4">
    <aside class="no-print w-full lg:w-80 bg-white rounded-xl shadow-sm border border-slate-200 p-3 h-[480px] lg:h-[840px] flex flex-col">
      <div class="flex items-center justify-between pb-2 border-b border-slate-200">
        <span class="text-xs font-bold text-slate-700">मतदाता (<span id="countText">0</span>)</span>
        <span class="text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-semibold" id="dbStatus">डेटा लोड हो रहा है...</span>
      </div>
      <div id="voterList" class="flex-1 overflow-y-auto divide-y divide-slate-100 mt-2 pr-1"></div>
    </aside>

    <section class="flex-1 bg-slate-200/70 p-2 md:p-4 rounded-xl flex justify-center items-start overflow-x-auto min-h-[600px]">
      <div id="captureArea" class="print-page bg-white w-full max-w-[210mm] min-h-[297mm] shadow-lg rounded-sm p-4 md:p-6 flex flex-col justify-between">
        <div id="sheetContent" class="w-full"></div>
      </div>
    </section>
  </main>

  <div id="modalSettings" class="no-print fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-5 shadow-2xl relative">
      <button onclick="closeSettingsModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h3 class="text-base font-bold font-yatra text-slate-900 border-b pb-2 mb-3">
        प्रत्याशी व चुनाव चिन्ह सेटिंग
      </h3>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">प्रत्याशी का नाम:</label>
          <input type="text" id="cfgCandName" class="w-full border rounded p-2 text-sm focus:ring-1 focus:ring-amber-500 font-bold">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">चुनाव पद:</label>
            <select id="cfgCandPostSelect" class="w-full border rounded p-2 text-xs font-semibold">
              <option value="सरपंच पद प्रत्याशी">सरपंच पद प्रत्याशी</option>
              <option value="वार्ड पंच प्रत्याशी">वार्ड पंच प्रत्याशी</option>
              <option value="पंचायत समिति सदस्य प्रत्याशी">पं. समिति सदस्य प्रत्याशी</option>
              <option value="जिला परिषद सदस्य प्रत्याशी">जिला परिषद सदस्य प्रत्याशी</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">वार्ड / क्षेत्र नं.:</label>
            <input type="text" id="cfgWardNo" placeholder="उदा. वार्ड नं. 04" class="w-full border rounded p-2 text-xs">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">ग्राम पंचायत / क्षेत्र:</label>
          <input type="text" id="cfgPanchayat" class="w-full border rounded p-2 text-xs font-semibold">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">चुनावी अपील / स्लोगन:</label>
          <textarea id="cfgAppeal" rows="2" class="w-full border rounded p-2 text-xs font-tiro"></textarea>
        </div>

        <div class="pt-2 border-t">
          <label class="block font-semibold text-slate-700 mb-1">चुनाव चिन्ह की स्थिति:</label>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="symStatus" value="blank" checked>
              <span>अभी रिक्त रखें (आवंटन पश्चात)</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" name="symStatus" value="custom">
              <span>चिन्ह नाम / फोटो जोड़ें</span>
            </label>
          </div>
        </div>

        <div id="symCustomFields" class="hidden space-y-2 bg-slate-50 p-2.5 rounded border border-slate-200">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">चिन्ह का नाम:</label>
            <input type="text" id="cfgSymName" placeholder="उदा. बल्ला, उगता सूरज" class="w-full border rounded p-1.5 text-xs">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">चिन्ह की फोटो अपलोड करें:</label>
            <input type="file" id="cfgSymFile" accept="image/*" class="w-full text-xs">
          </div>
        </div>
      </div>

      <div class="mt-4 pt-3 border-t flex justify-end gap-2">
        <button onclick="saveCandidateSettings()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded font-bold text-xs">
          सेव करें
        </button>
      </div>
    </div>
  </div>

  <script>
    const CANDIDATE_REGISTRY = {
      "1001": { name: "जीव सिंह देवड़ा", post: "सरपंच पद प्रत्याशी", ward: "", panchayat: "ग्राम पंचायत मालवाड़ा", constituency: "145 - रानीवाड़ा", tagline: "विकास • शिक्षा • स्वच्छता • समृद्धि", appeal: "ग्राम पंचायत मालवाड़ा के सर्वांगीण विकास एवं खुशहाली हेतु अपना अमूल्य मत व समर्थन देकर भारी मतों से विजयी बनावें।", symbolStatus: "blank", symbolName: "", symbolImg: null },
      "1002": { name: "दिनेश कुमार देवासी", post: "सरपंच पद प्रत्याशी", ward: "", panchayat: "ग्राम पंचायत मालवाड़ा", constituency: "145 - रानीवाड़ा", tagline: "ईमानदारी • कर्मठता • सेवा भाव", appeal: "गांव के हर नागरिक के हक और पंचायत के समग्र विकास हेतु आपके आशीर्वाद और समर्थन का आकांक्षी।", symbolStatus: "custom", symbolName: "बल्ला", symbolImg: null },
      "2001": { name: "प्रकाश कुमार सेन", post: "वार्ड पंच प्रत्याशी", ward: "वार्ड संख्या 04", panchayat: "ग्राम पंचायत मालवाड़ा", constituency: "145 - रानीवाड़ा", tagline: "सशक्त वार्ड • पारदर्शी विकास", appeal: "वार्ड संख्या 04 की बुनियादी समस्याओं के त्वरित समाधान हेतु अपना बहुमूल्य वोट देकर सफल बनावें।", symbolStatus: "blank", symbolName: "", symbolImg: null },
      "3001": { name: "महिपाल सिंह राठौड़", post: "पंचायत समिति सदस्य प्रत्याशी", ward: "वार्ड सं. 12", panchayat: "पंचायत समिति रानीवाड़ा", constituency: "145 - रानीवाड़ा", tagline: "युवा सोच • सशक्त ग्रामीण प्रतिनिधित्व", appeal: "क्षेत्र के चहुंमुखी विकास व किसान-मजदूर के अधिकारों की आवाज उठाने हेतु भारी मतों से विजयी बनावें।", symbolStatus: "blank", symbolName: "", symbolImg: null },
      "4001": { name: "हिम्मत राम विश्नोई", post: "जिला परिषद सदस्य प्रत्याशी", ward: "क्षेत्र सं. 08", panchayat: "जिला परिषद जालोर", constituency: "145 - रानीवाड़ा", tagline: "न्याय • प्रगति • निष्पक्ष सेवा", appeal: "क्षेत्र के सर्वांगीण विकास, उच्च स्तरीय सड़कों और स्वास्थ्य सेवाओं के सुदृढ़ीकरण हेतु विजयी बनावें।", symbolStatus: "blank", symbolName: "", symbolImg: null }
    };

    const BOOTH_INFO = {
      235: { name: "राजकीय उच्च माध्यमिक विद्यालय, मालवाड़ा", location: "बायाँ कमरा 2", anubhag: "भीलों का वास, मेघवाल वास, मालवाड़ा" },
      236: { name: "राजकीय उच्च माध्यमिक विद्यालय, मालवाड़ा", location: "लाधाणी परिसर", anubhag: "लाधाणी वास, पुराना बाजार, मालवाड़ा" },
      237: { name: "राजकीय उच्च माध्यमिक विद्यालय, मालवाड़ा", location: "कमरा नं 5", anubhag: "राजपूतों का वास, सैनियों का वास, मालवाड़ा" }
    };

    let appState = {
      mode: 'family',
      personalPos: 'left',
      selectedVoter: null,
      filteredVoters: [],
      currentCandidate: CANDIDATE_REGISTRY["1001"]
    };

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const pin = urlParams.get('pin');
      if (pin && CANDIDATE_REGISTRY[pin]) {
        appState.currentCandidate = CANDIDATE_REGISTRY[pin];
      }

      document.getElementById('activeCandidateNameText').innerText = `${appState.currentCandidate.name} (${appState.currentCandidate.post})`;

      initDatabase();
      setupEvents();
    });

    function initDatabase() {
      const dbLabel = document.getElementById('dbStatus');
      const voters = window.CURRENT_PANCHAYAT_VOTERS || window.ALL_MALWARA_VOTERS;
      if (voters && Array.isArray(voters) && voters.length > 0) {
        dbLabel.innerText = `${voters.length} वोटर्स लोड हैं`;
        dbLabel.className = "text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-semibold";
        appState.filteredVoters = voters;
        appState.selectedVoter = voters[0];
        renderVoterList();
        renderActiveSheet();
      } else {
        dbLabel.innerText = "डेटा लोड नहीं हुआ!";
      }
    }

    function setupEvents() {
      document.getElementById('searchInput').addEventListener('input', handleFilter);
      document.getElementById('partFilter').addEventListener('change', handleFilter);

      const modeFamBtn = document.getElementById('modeFamily');
      const modePerBtn = document.getElementById('modePersonal');
      const posWrap = document.getElementById('personalPosWrapper');
      const posLeftBtn = document.getElementById('btnPosLeft');
      const posTopBtn = document.getElementById('btnPosTop');

      modeFamBtn.addEventListener('click', () => {
        appState.mode = 'family';
        modeFamBtn.className = "px-3 py-1.5 text-xs font-bold rounded bg-amber-600 text-white shadow-sm flex items-center gap-1.5 transition";
        modePerBtn.className = "px-3 py-1.5 text-xs font-medium rounded text-slate-700 hover:text-slate-900 flex items-center gap-1.5 transition";
        posWrap.classList.add('hidden');
        renderActiveSheet();
      });

      modePerBtn.addEventListener('click', () => {
        appState.mode = 'personal';
        modePerBtn.className = "px-3 py-1.5 text-xs font-bold rounded bg-amber-600 text-white shadow-sm flex items-center gap-1.5 transition";
        modeFamBtn.className = "px-3 py-1.5 text-xs font-medium rounded text-slate-700 hover:text-slate-900 flex items-center gap-1.5 transition";
        posWrap.classList.remove('hidden');
        renderActiveSheet();
      });

      posLeftBtn.addEventListener('click', () => {
        appState.personalPos = 'left';
        posLeftBtn.className = "px-2 py-1 text-xs border rounded bg-slate-800 text-white font-medium";
        posTopBtn.className = "px-2 py-1 text-xs border rounded bg-white text-slate-700 font-medium";
        renderActiveSheet();
      });

      posTopBtn.addEventListener('click', () => {
        appState.personalPos = 'top';
        posTopBtn.className = "px-2 py-1 text-xs border rounded bg-slate-800 text-white font-medium";
        posLeftBtn.className = "px-2 py-1 text-xs border rounded bg-white text-slate-700 font-medium";
        renderActiveSheet();
      });

      document.querySelectorAll("input[name='symStatus']").forEach(r => {
        r.addEventListener('change', (e) => {
          const customBox = document.getElementById('symCustomFields');
          if (e.target.value === 'custom') customBox.classList.remove('hidden');
          else customBox.classList.add('hidden');
        });
      });
    }

    function handleFilter() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const part = document.getElementById('partFilter').value;
      const voters = window.CURRENT_PANCHAYAT_VOTERS || window.ALL_MALWARA_VOTERS || [];

      appState.filteredVoters = voters.filter(v => {
        const matchesPart = (part === 'all') || (v.p.toString() === part);
        if (!matchesPart) return false;

        if (!q) return true;
        return (v.name && v.name.toLowerCase().includes(q)) || 
               (v.rel && v.rel.toLowerCase().includes(q)) || 
               (v.epic && v.epic.toLowerCase().includes(q)) || 
               (v.h && v.h.toLowerCase().includes(q)) || 
               (v.s && v.s.toString() === q);
      });

      renderVoterList();
    }

    function renderVoterList() {
      const container = document.getElementById('voterList');
      document.getElementById('countText').innerText = appState.filteredVoters.length;
      container.innerHTML = '';

      if (appState.filteredVoters.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">कोई मतदाता नहीं मिला</div>';
        return;
      }

      appState.filteredVoters.slice(0, 100).forEach(voter => {
        const isSelected = appState.selectedVoter && (appState.selectedVoter.p === voter.p && appState.selectedVoter.s === voter.s);
        const item = document.createElement('div');
        item.className = `p-2.5 rounded-lg cursor-pointer text-xs transition mb-1 border ${
          isSelected ? 'bg-amber-50 border-amber-500 shadow-sm' : 'bg-white hover:bg-slate-50 border-slate-200'
        }`;

        item.innerHTML = `
          <div class="flex items-center justify-between font-bold text-slate-800">
            <span>${voter.name}</span>
            <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono">भाग ${voter.p} | #${voter.s}</span>
          </div>
          <div class="text-[11px] text-slate-500 flex justify-between mt-0.5">
            <span>पिता/पति: ${voter.rel || '-'}</span>
            <span>मकान: ${voter.h || '-'}</span>
          </div>
          <div class="text-[10px] text-amber-700 font-mono mt-0.5 font-semibold">EPIC: ${voter.epic || '-'}</div>
        `;

        item.addEventListener('click', () => {
          appState.selectedVoter = voter;
          renderVoterList();
          renderActiveSheet();
        });
        container.appendChild(item);
      });
    }

    function openSettingsModal() {
      const c = appState.currentCandidate;
      document.getElementById('cfgCandName').value = c.name;
      document.getElementById('cfgCandPostSelect').value = c.post;
      document.getElementById('cfgWardNo').value = c.ward || '';
      document.getElementById('cfgPanchayat').value = c.panchayat;
      document.getElementById('cfgAppeal').value = c.appeal;
      document.getElementById('cfgSymName').value = c.symbolName || '';

      const symRadio = document.querySelector(`input[name='symStatus'][value='${c.symbolStatus}']`);
      if (symRadio) symRadio.checked = true;

      const customBox = document.getElementById('symCustomFields');
      if (c.symbolStatus === 'custom') customBox.classList.remove('hidden');
      else customBox.classList.add('hidden');

      document.getElementById('modalSettings').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('modalSettings').classList.add('hidden');
    }

    function saveCandidateSettings() {
      const c = appState.currentCandidate;
      c.name = document.getElementById('cfgCandName').value || c.name;
      c.post = document.getElementById('cfgCandPostSelect').value;
      c.ward = document.getElementById('cfgWardNo').value.trim();
      c.panchayat = document.getElementById('cfgPanchayat').value || c.panchayat;
      c.appeal = document.getElementById('cfgAppeal').value || c.appeal;
      c.symbolStatus = document.querySelector("input[name='symStatus']:checked").value;
      c.symbolName = document.getElementById('cfgSymName').value.trim();

      const symFile = document.getElementById('cfgSymFile');
      if (c.symbolStatus === 'custom' && symFile.files && symFile.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          c.symbolImg = e.target.result;
          closeSettingsModal();
          renderActiveSheet();
        };
        reader.readAsDataURL(symFile.files[0]);
      } else {
        closeSettingsModal();
        renderActiveSheet();
      }
    }

    function getCandidateGrandPosterHTML() {
      const cand = appState.currentCandidate;
      let symbolBoxContent = `
        <div class="w-full h-full flex flex-col items-center justify-center p-2 text-center">
          <div class="text-[10px] font-bold text-red-700 uppercase tracking-widest mb-0.5">चुनाव चिन्ह</div>
          <div class="border-t border-dashed border-red-300 w-12 my-0.5"></div>
          <div class="text-[11px] font-extrabold text-red-900 leading-tight">(रिक्त स्थान)</div>
          <div class="text-[9px] text-slate-500 mt-1 font-medium">आवंटन पश्चात</div>
        </div>
      `;

      if (cand.symbolStatus === 'custom') {
        if (cand.symbolImg) {
          symbolBoxContent = `<div class="w-full h-full flex flex-col items-center justify-center p-1.5 text-center"><img src="${cand.symbolImg}" class="max-h-20 max-w-full object-contain mb-1"><div class="text-xs font-bold text-red-900 font-rozha">${cand.symbolName}</div></div>`;
        } else {
          symbolBoxContent = `<div class="w-full h-full flex flex-col items-center justify-center p-2 text-center"><div class="text-[10px] font-bold text-red-700 uppercase">चुनाव चिन्ह</div><div class="text-sm font-extrabold text-red-900 font-rozha mt-1">${cand.symbolName || 'आवंटित'}</div></div>`;
        }
      }

      const wardDisplay = cand.ward ? `<span class="bg-amber-400 text-slate-950 px-2 py-0.5 rounded font-black text-xs ml-2">${cand.ward}</span>` : '';

      return `
        <div class="w-full bg-royal-maroon text-white rounded-xl border-4 border-amber-500/80 p-4 md:p-6 shadow-md relative overflow-hidden mb-4">
          <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>
          <div class="flex items-center justify-between text-xs text-amber-200 border-b border-amber-400/30 pb-2 mb-3">
            <span class="font-bold tracking-wider">॥ श्री गणेशाय नमः ॥</span>
            <span class="font-semibold bg-amber-500/20 px-2.5 py-0.5 rounded text-amber-300 border border-amber-400/30">विधानसभा क्षेत्र: ${cand.constituency}</span>
          </div>

          <div class="flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border-4 border-amber-400 bg-amber-950/60 shadow-xl flex items-center justify-center overflow-hidden shrink-0">
                <i class="fa-solid fa-user-tie text-5xl text-amber-300"></i>
              </div>
              <div>
                <div class="flex items-center flex-wrap gap-1">
                  <span class="text-xs md:text-sm font-bold tracking-wider text-amber-300 uppercase px-2 py-0.5 rounded bg-black/40 border border-amber-400/40">${cand.post}</span>
                  ${wardDisplay}
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold font-yatra text-white tracking-wide mt-1 text-gold">${cand.name}</h2>
                <p class="text-sm md:text-base font-bold text-amber-200 font-tiro mt-0.5">${cand.panchayat}</p>
              </div>
            </div>

            <div class="w-28 h-28 md:w-32 md:h-32 symbol-box-dashed rounded-xl shadow-lg shrink-0 flex items-center justify-center">${symbolBoxContent}</div>
          </div>

          <div class="mt-4 pt-3 border-t border-amber-400/30 text-center">
            <p class="text-xs md:text-sm text-slate-100 font-medium font-tiro max-w-2xl mx-auto leading-relaxed">"${cand.appeal}"</p>
            <div class="mt-2 text-xs font-bold text-amber-300 tracking-widest bg-black/30 py-1 px-4 rounded-full inline-block border border-amber-400/20">${cand.tagline}</div>
          </div>
        </div>
      `;
    }

    function renderActiveSheet() {
      const container = document.getElementById('sheetContent');
      if (!appState.selectedVoter) {
        container.innerHTML = '<div class="text-center py-20 text-slate-400 font-bold">मतदाता का चयन करें</div>';
        return;
      }
      if (appState.mode === 'family') renderFamilyWiseSheet(container);
      else renderPersonalSheet(container);
    }

    function renderFamilyWiseSheet(container) {
      const cur = appState.selectedVoter;
      const booth = BOOTH_INFO[cur.p] || { name: "मालवाड़ा", location: "-", anubhag: "मालवाड़ा" };
      const voters = window.CURRENT_PANCHAYAT_VOTERS || window.ALL_MALWARA_VOTERS || [];

      const familyMembers = voters.filter(v => v.p === cur.p && (v.h && cur.h && v.h.trim().toLowerCase() === cur.h.trim().toLowerCase()));
      familyMembers.sort((a, b) => a.s - b.s);

      let cardsHtml = '';
      familyMembers.forEach(m => {
        cardsHtml += `
          <div class="border-2 border-slate-900 rounded p-2.5 bg-white flex flex-col justify-between h-[135px] text-xs">
            <div class="flex items-center justify-between border-b border-slate-300 pb-1 font-mono">
              <span class="px-2 py-0.5 bg-slate-100 border border-slate-400 font-bold text-slate-900 rounded-sm">${m.s}</span>
              <span class="font-extrabold text-slate-900 tracking-wider">${m.epic || '-'}</span>
            </div>
            <div class="flex items-stretch justify-between gap-1 mt-1.5 flex-1">
              <div class="space-y-0.5 flex-1 pr-1">
                <div class="text-[10px] text-slate-500 font-semibold leading-none">निर्वाचक का नाम :</div>
                <div class="font-bold text-sm text-slate-900 truncate leading-tight">${m.name}</div>
                <div class="text-[10px] text-slate-500 font-semibold leading-none mt-1">पिता/पति का नाम :</div>
                <div class="text-xs text-slate-800 truncate font-medium leading-tight">${m.rel || '-'}</div>
                <div class="text-[11px] text-slate-700 font-semibold mt-1">गृह संख्या : <span class="font-mono font-bold">${m.h || '-'}</span></div>
              </div>
              <div class="w-16 h-full border border-slate-400 bg-slate-50 flex items-center justify-center p-1 text-center shrink-0">
                <span class="text-[9px] text-slate-500 leading-tight font-medium">फोटो<br>उपलब्ध</span>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        ${getCandidateGrandPosterHTML()}
        <div class="w-full bg-slate-100 border border-slate-300 rounded px-3 py-2 text-xs flex flex-wrap items-center justify-between font-semibold text-slate-800 mb-3 shadow-inner">
          <div><span class="text-slate-500">विधान सभा क्षेत्र :</span> 145-रानीवाड़ा</div>
          <div><span class="text-slate-500">अनुभाग :</span> ${booth.anubhag}</div>
          <div><span class="text-slate-500">भाग संख्या :</span> <span class="font-bold font-mono text-amber-700">${cur.p}</span></div>
          <div class="bg-amber-200 text-amber-900 px-2 py-0.5 rounded font-mono font-bold">गृह संख्या : ${cur.h || '-'}</div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">${cardsHtml}</div>
        <div class="mt-4 pt-2 border-t border-slate-200 text-[10px] text-slate-400 flex justify-between items-center">
          <span>${appState.currentCandidate.panchayat} निर्वाचन • परिवार मतदाता पर्ची</span>
          <span>कुल पारिवारिक मतदाता: ${familyMembers.length}</span>
        </div>
      `;
    }

    function renderPersonalSheet(container) {
      const cur = appState.selectedVoter;
      const booth = BOOTH_INFO[cur.p] || { name: "मालवाड़ा", location: "-", anubhag: "मालवाड़ा" };
      const cand = appState.currentCandidate;

      let symbolHtml = `<div class="symbol-box-dashed p-2 rounded text-center"><div class="text-[9px] font-bold text-red-700">चुनाव चिन्ह</div><div class="text-[11px] font-extrabold text-red-900">(रिक्त स्थान)</div></div>`;
      if (cand.symbolStatus === 'custom') {
        if (cand.symbolImg) symbolHtml = `<div class="symbol-box-dashed p-1.5 rounded text-center"><img src="${cand.symbolImg}" class="max-h-12 max-w-full mx-auto object-contain"><div class="text-[10px] font-bold text-red-900">${cand.symbolName}</div></div>`;
        else symbolHtml = `<div class="symbol-box-dashed p-2 rounded text-center font-bold text-red-900 text-xs">${cand.symbolName}</div>`;
      }

      const candBoxHtml = `
        <div class="bg-royal-maroon text-white p-3.5 rounded-lg border-2 border-amber-500 flex flex-col justify-between shadow">
          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <div class="w-10 h-10 rounded-full border-2 border-amber-400 flex items-center justify-center bg-black/30"><i class="fa-solid fa-user-tie text-amber-300 text-lg"></i></div>
              <div>
                <span class="text-[9px] font-bold uppercase text-amber-300">${cand.post} ${cand.ward || ''}</span>
                <div class="font-bold text-base text-gold font-yatra leading-tight">${cand.name}</div>
              </div>
            </div>
            <p class="text-[10px] text-slate-200 font-tiro leading-snug">"${cand.appeal}"</p>
          </div>
          <div class="mt-2 pt-2 border-t border-amber-400/30 flex items-center justify-between">
            <span class="text-[9px] text-amber-200 font-bold">${cand.tagline}</span>
            <div class="w-20">${symbolHtml}</div>
          </div>
        </div>
      `;

      const officialSlipTableHtml = `
        <div class="border-2 border-slate-900 rounded bg-white p-3 shadow-sm flex-1">
          <div class="border-2 border-slate-900 py-1.5 px-3 text-center mb-3">
            <h3 class="text-base font-extrabold font-rozha tracking-wider text-slate-900">फोटो मतदाता पर्ची / PHOTO VOTER SLIP</h3>
          </div>
          <div class="flex flex-col md:flex-row gap-3">
            <div class="w-full md:w-44 flex flex-col items-center">
              <div class="w-36 h-44 border-2 border-slate-800 bg-slate-100 flex flex-col items-center justify-center p-2 text-center relative overflow-hidden">
                <i class="fa-solid fa-user text-6xl text-slate-400"></i>
                <span class="text-[9px] font-bold text-slate-500 mt-2">फोटो / PHOTO</span>
              </div>
              <div class="w-36 mt-3 border border-slate-400 p-1.5 text-[10px] text-slate-700">
                <div class="font-bold">Date of Poll: _________</div>
                <div class="font-bold mt-1">Timings: ___ to ___</div>
              </div>
            </div>
            <div class="flex-1">
              <table class="w-full text-xs border border-slate-800 divide-y divide-slate-800">
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold w-1/3">राज्य / State</td><td class="p-1.5 font-semibold text-slate-900">राजस्थान (Rajasthan)</td></tr>
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold">विधान सभा क्षेत्र</td><td class="p-1.5 font-bold text-slate-900">145 - रानीवाड़ा</td></tr>
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold">नाम / Name</td><td class="p-1.5 font-bold text-sm text-slate-900">${cur.name}</td></tr>
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold">पहचान पत्र (EPIC)</td><td class="p-1.5 font-extrabold text-sm text-amber-800 font-mono">${cur.epic || '-'}</td></tr>
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold">पिता/पति का नाम</td><td class="p-1.5 font-semibold text-slate-900">${cur.rel || '-'}</td></tr>
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold">गृह संख्या / House No.</td><td class="p-1.5 font-bold text-slate-900 font-mono">${cur.h || '-'}</td></tr>
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold">भाग संख्या / Part No.</td><td class="p-1.5 font-bold text-slate-900 font-mono">${cur.p} (${booth.location})</td></tr>
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold">मतदाता क्रमांक / Serial</td><td class="p-1.5 font-extrabold text-base text-slate-950 font-mono bg-amber-50"># ${cur.s}</td></tr>
                <tr class="divide-x divide-slate-800"><td class="p-1.5 bg-slate-50 font-bold">मतदान केंद्र / Booth</td><td class="p-1.5 font-medium text-slate-800 text-[11px]">${booth.name}, ${booth.location}</td></tr>
              </table>
            </div>
          </div>
          <div class="mt-3 pt-1.5 border-t border-slate-300 flex justify-between text-[10px] text-slate-500">
            <span>जिला निर्वाचन कार्यालय • जिला जालोर</span>
            <span>हेल्पलाइन नं.: 1950</span>
          </div>
        </div>
      `;

      if (appState.personalPos === 'left') {
        container.innerHTML = `<div class="flex flex-col lg:flex-row gap-4 items-stretch"><div class="w-full lg:w-72 shrink-0">${candBoxHtml}</div>${officialSlipTableHtml}</div>`;
      } else {
        container.innerHTML = `<div class="flex flex-col gap-4">${candBoxHtml}${officialSlipTableHtml}</div>`;
      }
    }

    function exportToImage() {
      const target = document.getElementById('captureArea');
      if (!target) return;
      const btn = document.getElementById('btnDownloadImg');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> डाउनलोड...';

      html2canvas(target, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
        const link = document.createElement('a');
        const vName = appState.selectedVoter ? appState.selectedVoter.name.replace(/\s+/g, '_') : 'voter';
        link.download = `VoterSlip_${vName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.innerHTML = originalText;
      }).catch(err => {
        alert("डाउनलोड में त्रुटि आई।");
        btn.innerHTML = originalText;
      });
    }
  </script>
</body>
</html>
